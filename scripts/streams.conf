# Test streams for scripts/streams.sh: <stream name> <video file, relative to the project root>
# Each one is pushed in a loop to rtsp://127.0.0.1/live/<name>; the API registers it as a device
# and starts an AI worker. Files come from scripts/get_samples.sh. Comment a line out to skip it.
# Once a choice is made in the web UI (设备管理 -> 测试推流), data/streams.enabled decides instead.
ped     data/samples/pedestrians.mp4
#street  data/samples/street.mp4
#cars    data/samples/cars.mp4
#people  data/samples/people.mp4
#worker  data/samples/worker.mp4
store   data/samples/store.mp4
# still: mostly static camera (20 s empty aisle, then people walk in), shows 画面静止时跳过推理
still   data/samples/still.mp4
# hd: 1920x1080 highway traffic, shows YUV 直通 (视频实验室): per-frame color conversions grow with size
hd      data/samples/hd.mp4
# fall: 姿态识别 / 摔倒检测 (UR Fall Dataset, 9 falls + 3 daily activities). The API runs the pose
# model on streams named in POSE_STREAMS (default "fall")
fall    data/samples/fall.mp4
