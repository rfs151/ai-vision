# ai-vision: ZLMediaKit + control service/AI workers (+ optional demo streams)
#
#   cp .env.example .env && vi .env          # at least ZLM_SECRET (and PUBLIC_IP on a server)
#   docker compose up -d --build             # http://<host>:8090
#   docker compose --profile demo up -d      # + 6 looped test videos (downloaded on first start)
#
# network_mode host: WebRTC uses UDP and announces the host IP; host networking is the simplest
# correct setup on a single server (no NAT, no port lists). Ports are set in .env.
# Container logs: Docker keeps them forever by default; cap each container at 3 x 10 MB
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  zlm:
    logging: *logging
    image: ${ZLM_IMAGE:-zlmediakit/zlmediakit:master}
    network_mode: host
    restart: unless-stopped
    command: ["sh", "/start.sh"]
    volumes:
      - ./deploy/zlm-start.sh:/start.sh:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ZLM_SECRET: ${ZLM_SECRET:?set ZLM_SECRET in .env}
      PUBLIC_IP: ${PUBLIC_IP:-}
      API_PORT: ${API_PORT:-8090}
      ZLM_HTTP_PORT: ${ZLM_HTTP_PORT:-80}
      ZLM_RTSP_PORT: ${ZLM_RTSP_PORT:-554}
      ZLM_RTMP_PORT: ${ZLM_RTMP_PORT:-1935}
      ZLM_RTC_PORT: ${ZLM_RTC_PORT:-8000}

  app:
    logging: *logging
    build:
      context: .
      args:
        REGISTRY: ${REGISTRY:-}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.org/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        APT_MIRROR: ${APT_MIRROR:-}
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
        MODEL_URL: ${MODEL_URL:-https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt}
    image: ai-vision:latest
    network_mode: host
    restart: unless-stopped
    depends_on: [zlm]
    # Alarm clip ring buffer lives in /dev/shm (~10 MB per stream); Docker's default is only 64 MB
    shm_size: 1gb
    volumes:
      - ${DATA_PATH:-./data}:/app/data     # database, snapshots, clips, logs, sample videos
    environment: &app_env
      TZ: ${TZ:-Asia/Shanghai}
      ZLM_SECRET: ${ZLM_SECRET}
      API_PORT: ${API_PORT:-8090}
      API_URL: http://127.0.0.1:${API_PORT:-8090}
      ZLM_API: http://127.0.0.1:${ZLM_HTTP_PORT:-80}
      ZLM_RTSP: rtsp://127.0.0.1:${ZLM_RTSP_PORT:-554}
      PLAY_HTTP_PORT: ${ZLM_HTTP_PORT:-80}
      PLAY_RTSP_PORT: ${ZLM_RTSP_PORT:-554}
      MAX_WORKERS: ${MAX_WORKERS:-8}
      WORKER_ARGS: ${WORKER_ARGS:-}
      MEDIA_KEEP_DAYS: ${MEDIA_KEEP_DAYS:-7}
      MEDIA_MAX_GB: ${MEDIA_MAX_GB:-5}

  # Simulated cameras: downloads the sample videos once (data/samples), then loops them into live/*
  demo:
    logging: *logging
    image: ai-vision:latest
    profiles: ["demo"]
    network_mode: host
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    environment:
      <<: *app_env
      PROXY: ${DOWNLOAD_PROXY:-}
    command: ["bash", "-c", "scripts/get_samples.sh && exec scripts/streams.sh run"]
