<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <style>.pf-back{position:fixed;left:20px;top:10px;z-index:3000;font-size:13px;color:#79bbff;text-decoration:none}.aside .brand{padding-top:34px!important;padding-bottom:12px!important}.pf-back:hover{text-decoration:underline}@media (max-width:760px){.pf-back{left:auto;top:auto;right:12px;bottom:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:999px}}</style>
  <script>(function(){var u=(function(){var h=location.hostname;if(h==='localhost'||h==='127.0.0.1')return 'http://127.0.0.1:8880/';if(/^\d+\.\d+\.\d+\.\d+$/.test(h))return 'http://'+h+'/';return 'https://edgebot.vip/'})();function fix(){document.querySelectorAll('a.pf-back').forEach(function(a){a.href=u})}document.addEventListener('DOMContentLoaded',fix);document.addEventListener('mouseover',function(e){var a=e.target.closest&&e.target.closest('a.pf-back');if(a)a.href=u},true);document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a.pf-back');if(a)a.href=u},true);})();</script>

    <div id="app"></div>
